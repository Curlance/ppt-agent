[project]
name = "ppt-agent"
version = "0.1.0"
description = "让 agent 实时控制 PowerPoint：单一工具注册表驱动 MCP / HTTP+OpenAPI / CLI 三个面，全程可视。"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Windows COM bridge; pip installs it inside the selected environment.
    "pywin32>=311; sys_platform == 'win32'",
    "python-pptx>=1.0",
    "pillow>=10",
    "httpx>=0.27",
    "sse-starlette>=2",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyyaml>=6"]

[project.scripts]
pptctl = "pptd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pptd"]

[tool.hatch.build.targets.wheel.force-include]
"skills/ppt-agent" = "pptd/resources/skills/ppt-agent"
"addin/vba" = "pptd/resources/addin/vba"
"addin/README.md" = "pptd/resources/addin/README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑不需要真机 PowerPoint 的用例；真机集成测试用 `-m com` 显式启用。
addopts = '-m "not com"'
markers = [
    "com: 需要真机 PowerPoint 的集成测试（python -m pytest -m com）",
]
