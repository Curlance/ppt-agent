name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]" build
      - name: Unit tests (no desktop Office)
        run: python -m pytest -q
      - name: Generated API documentation
        run: python -m pptd export-api --check
      - name: Build package
        run: python -m build
