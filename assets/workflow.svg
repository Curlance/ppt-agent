<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">ppt-agent — See every step</title>
  <desc id="desc">An agent reads and edits a visible PowerPoint window through a serial COM worker. The observer shows a live preview and activity feed.</desc>
  <rect width="1280" height="400" rx="28" fill="#141b2b"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="56" y="63" fill="#ff9a55" font-size="17" font-weight="700" letter-spacing="3">PPT-AGENT / LIVE POWERPOINT</text>
    <text x="56" y="112" fill="#ffffff" font-size="34" font-weight="700">Real slides. Visible actions.</text>
    <text x="56" y="145" fill="#bcc7da" font-size="18">Read → Edit → Verify · One tool registry · One COM owner</text>
    <g fill="#1e293e" stroke="#354561" stroke-width="2">
      <rect x="56" y="190" width="260" height="118" rx="18"/>
      <rect x="385" y="190" width="290" height="118" rx="18"/>
      <rect x="744" y="190" width="480" height="118" rx="18" stroke="#ff9a55"/>
    </g>
    <g stroke="#4dd9e8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 250h39m-10-9 10 9-10 9"/>
      <path d="M689 250h39m-10-9 10 9-10 9"/>
    </g>
    <g fill="#ffffff" font-size="23" font-weight="700">
      <text x="82" y="238">AI agent</text>
      <text x="411" y="238">Serial COM / STA</text>
      <text x="770" y="238">Visible PowerPoint</text>
    </g>
    <g fill="#bcc7da" font-size="16">
      <text x="82" y="275">MCP · HTTP · CLI</text>
      <text x="411" y="275">24 tools · One daemon</text>
      <text x="770" y="275">Follow slide &amp; shape · Read back</text>
    </g>
    <circle cx="64" cy="352" r="5" fill="#4dd9e8"/>
    <text x="82" y="358" fill="#4dd9e8" font-size="17">Observer: live preview + activity feed + pacing</text>
    <text x="1224" y="358" text-anchor="end" fill="#879bb9" font-size="15">Windows · Desktop Office</text>
  </g>
</svg>
